<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Send a message to 303 Coffee." />
  <meta name="theme-color" content="#f4efe6" />
  <title>Contact · 303 Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b140f'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia' font-size='12' fill='%23f4efe6'%3E303%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../site.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <a class="mark" href="../"><span>303</span> Coffee</a>
    </header>
    <main>
      <article class="sheet">
        <p class="kicker">303 Coffee</p>
        <h1>Contact</h1>
        <p>Send a message about an order or this store.</p>
        <form class="contact-form" id="contact-form" action="#message" method="post">
          <label>
            Name
            <input name="name" type="text" required maxlength="120" autocomplete="name" />
          </label>
          <label>
            Email
            <input name="email" type="email" required maxlength="160" autocomplete="email" />
          </label>
          <label>
            Message
            <textarea name="message" required maxlength="4000"></textarea>
          </label>
          <button class="buy" type="submit">Send message</button>
        </form>
        <p class="form-note" id="contact-thanks" hidden>Thanks. Your message is saved in this browser.</p>
      </article>
    </main>
    <footer>
      <span>303 Coffee</span>
      <nav class="footer-links" aria-label="Store policies">
        <a href="../refund-policy/">Refund policy</a>
        <a href="../shipping-policy/">Shipping policy</a>
        <a href="../terms-and-conditions/">Terms and conditions</a>
        <a href="../contact/" aria-current="page">Contact</a>
      </nav>
    </footer>
  </div>
  <script>
    const form = document.getElementById("contact-form");
    const thanks = document.getElementById("contact-thanks");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const note = {
        name: form.elements.name.value.trim(),
        email: form.elements.email.value.trim(),
        message: form.elements.message.value.trim(),
        sentAt: new Date().toISOString()
      };
      const saved = JSON.parse(localStorage.getItem("coffee-303-messages") || "[]");
      saved.push(note);
      localStorage.setItem("coffee-303-messages", JSON.stringify(saved));
      form.hidden = true;
      thanks.hidden = false;
    });
  </script>
</body>
</html>
